[platformio]
default_envs = firmware

[env:firmware]
platform = espressif32@6.13.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = time
board_build.partitions = min_spiffs.csv
extra_scripts = pre:tools/pre_build.py
lib_deps =
    https://github.com/J-A-A-M/ArduinoAsync.git#1.0.0-jaam.2
    https://github.com/J-A-A-M/melody-player.git@2.4.0
    adafruit/Adafruit NeoPixel@1.15.4
    bblanchon/ArduinoJson@7.4.3
    gilmaimon/ArduinoWebsockets@0.5.4
    denyschuhlib/NTPtime@1.2.1
    olikraus/U8g2@2.36.18
    sensirion/arduino-sht@1.2.6
    https://github.com/enjoyneering/AHTxx.git@1.2.0
    https://github.com/J-A-A-M/Forced-BMX280.git#1.1.2-jaam.1
    wollewald/BH1750_WE@1.1.10
	dfrobot/DFRobot_DF1201S@^1.0.2
    mathertel/OneButton@2.6.2
    tobozo/ESP32-targz@1.3.1
build_flags =
    -D BME280_ENABLED
	-D SHT2X_ENABLED
	-D SHT3X_ENABLED
    -D AHTXX_ENABLED
	-D BH1750_ENABLED
    -D BUZZER_ENABLED
	-D DFPLAYER_PRO_ENABLED
    -D DISPLAY_ENABLED
    -D VERSION=\"5.1.3\"
    -D CONFIG_ASYNC_TCP_MAX_ACK_TIME=5000 # (keep default)
    -D CONFIG_ASYNC_TCP_PRIORITY=10 # (keep default)
    -D CONFIG_ASYNC_TCP_QUEUE_SIZE=64 # (keep default)
    -D CONFIG_ASYNC_TCP_RUNNING_CORE=1

[env:telnet]
extends = env:firmware
lib_deps =
    ${env:firmware.lib_deps}
    yasheena/TelnetSpy@1.4
build_flags =
    ${env:firmware.build_flags}
    -D TELNET_ENABLED

[env:test_animation]
extends = env:firmware
build_flags =
    ${env:firmware.build_flags}
    -D TEST_ANIMATION

[env:test_min_of_silence]
extends = env:firmware
build_flags =
    ${env:firmware.build_flags}
    -D TEST_MIN_OF_SILENCE

[env:firmware_esp32s3]
extends = env:firmware
board = esp32-s3-devkitc-1
board_build.flash_size = 4MB
board_build.flash_mode = dio
board_upload.flash_size = 4MB
board_build.partitions = custom_4MB.csv

[env:firmware_esp32c3]
extends = env:firmware
board = esp32-c3-devkitc-02
build_unflags =
    -D CONFIG_ASYNC_TCP_RUNNING_CORE=1
build_flags =
    ${env:firmware.build_flags}
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CONFIG_ASYNC_TCP_RUNNING_CORE=0

; Hardware test + NVS defaults + OTA of the release firmware (test_mode/test_mode.cpp), one build per board platform.
; The factory station (tools/factory/factory_flash.py) picks the build by the type of the order: JAAM3.3 -> jaam3, JAAM2 -> jaam2, JAAM1 -> jaam1.
[env:test_mode_jaam3]
extends = env:firmware
build_src_filter = +<../src/> -<../src/JaamFusion.cpp> -<../src/JaamApi.cpp> -<../src/JaamSiren.cpp> -<../src/JaamWeb.cpp> -<../src/JaamAnimation.cpp> +<../test_mode/>
build_flags =
    ${env:firmware.build_flags}
    -D TEST_MODE
    -D PLATFORM_ID=3
    -D PLATFORM_NAME=\"JAAM3\"

[env:test_mode_jaam2]
extends = env:test_mode_jaam3
build_flags =
    ${env:firmware.build_flags}
    -D TEST_MODE
    -D PLATFORM_ID=2
    -D PLATFORM_NAME=\"JAAM2\"

[env:test_mode_jaam1]
extends = env:test_mode_jaam3
build_flags =
    ${env:firmware.build_flags}
    -D TEST_MODE
    -D PLATFORM_ID=1
    -D PLATFORM_NAME=\"JAAM1\"

; Kept for `pio run -e test_mode` and old notes: the same as JAAM3. For a custom platform name build with
; -D PLATFORM_ID=0 -D PLATFORM_NAME=\"ANY_NAME_YOU_WANT\" on top of one of the envs above.
[env:test_mode]
extends = env:test_mode_jaam3
