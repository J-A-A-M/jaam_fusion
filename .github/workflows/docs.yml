name: Validate Documentation Build

on:
  push:
    branches: [main, develop]
    paths:
      - 'wiki/**'
      - 'mkdocs.yml'
      - 'CHANGELOG.md'
      - 'requirements.txt'
      - 'deploy/wiki/**'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'wiki/**'
      - 'mkdocs.yml'
      - 'CHANGELOG.md'
      - 'requirements.txt'
      - 'deploy/wiki/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch: {}

run-name: Validate Documentation Build from '${{ github.ref_name }}' branch

permissions:
  contents: read

# Деплой цього образу (wiki) перенесено в J-A-A-M/jaam_server (build_images.yml робить
# cross-repo checkout звідси й білдить той самий deploy/wiki/Dockerfile, docker-compose.prod.yml
# піднімає контейнер разом з рештою сервісів). Тут лишається лише build-валідація - той
# самий Dockerfile, `mkdocs build --strict` усередині ловить биту документацію на PR, але
# образ нікуди не пушиться й не деплоїться звідси більше.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Full history is required by the git-revision-date-localized plugin.
          fetch-depth: 0

      - name: Build documentation image (validation only)
        run: docker build -t jaam_wiki:latest -f deploy/wiki/Dockerfile .
